name: brightpath

services:
  db:
    container_name: "DB"
    image: postgres:13
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: brightpath
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    container_name: "Redis"
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis:/data

  s3:
    container_name: "S3"
    image: gresau/localstack-persist
    environment:
      - PERSISTENCE=1
    ports:
      - "4566:4566"
    volumes:
      - s3:/persisted-data

  kafka:
    container_name: "Kafka"
    image: apache/kafka:3.8.0
    ports:
      - '9092:9092'

volumes:
  db:
  redis:
  s3:
